name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches version
        id: version
        run: |
          name=$(grep '^flashback.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^flashback.versionCode=' gradle.properties | cut -d= -f2)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $name"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk flashback.apk

      - name: Release notes and Karoo manifest
        run: |
          scripts/changelog-section.sh "${{ steps.version.outputs.name }}" > notes.md
          python3 scripts/karoo-manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --version "${{ steps.version.outputs.name }}" \
            --code "${{ steps.version.outputs.code }}" \
            --notes notes.md > manifest.json
          { cat notes.md; echo; echo '---'; echo; echo '> **Use at your own risk.** Flashback is not a safety device, can fail without warning (especially after Karoo firmware updates), and was written mostly by an AI (Claude). Provided as-is with no warranty. Read the [Disclaimer](https://github.com/'"$GITHUB_REPOSITORY"'#disclaimer) before installing.'; } > release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: |
            flashback.apk
            manifest.json
